{% extends 'base.html' %}
{% block title %}Registro - SeguroCRM{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-3">Crear cuenta</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="full_name">Nombre completo</label>
            <input class="form-control" type="text" id="full_name" name="full_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="role">Rol</label>
            <select class="form-select" id="role" name="role">
              <option value="agent">Agente</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="join_code">Código de equipo (solo agentes)</label>
            <input class="form-control" type="text" id="join_code" name="join_code" placeholder="Ingresa el código compartido por tu administrador">
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-primary" type="submit">Registrarme</button>
            <a href="{{ url_for('auth.login') }}">Ya tengo una cuenta</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
